name: Website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Builds the site, runs the browser and deployment checks, and deploys main.
  # On a pull request this runs the PR's own code with a read-only token.
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch publication branch tip
        continue-on-error: true
        run: git fetch --no-tags --depth=1 origin +refs/heads/admission-records:refs/remotes/origin/admission-records
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm run build
        env:
          QRH_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Install Chromium system dependencies
        timeout-minutes: 10
        run: |
          # The Azure mirror stalled font downloads; use Ubuntu's signed archive directly.
          sudo sed -i -E 's@mirror\+file:/etc/apt/apt-mirrors\.txt|https?://azure\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/apt.conf.d/zzzz-qrh-network-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          EOF
          apt-config dump Acquire::http::Timeout Acquire::https::Timeout Acquire::Retries
          npx playwright install-deps chromium
      - name: Download Chromium headless shell
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: npx playwright install --only-shell chromium
      - run: npm run test:browser
      - name: Test production paths and local provenance
        run: node scripts/test-deployment.mjs
        env:
          QRH_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: test-results/
      - name: Upload website
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/
  deploy:
    needs: website
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
