name: PR admission
on:
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to verify
        type: number
        required: true
permissions: {}
concurrency:
  group: pr-admission-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      verify: ${{ steps.prepare.outputs.verify }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the current admitted catalogue
        run: node scripts/reconcile-admissions.mjs --online
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QRH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Classify the PR and prepare verification
        id: prepare
        run: node verifier/check-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QRH_PR: ${{ github.event.pull_request.number || inputs.pr }}
          QRH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QRH_PHASE: prepare
      - name: Preserve the catalogue used for admission
        if: steps.prepare.outputs.verify == 'true'
        run: cp catalogue/results.json verification-context/catalogue.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.prepare.outputs.verify == 'true'
        with:
          name: verification-context-${{ github.run_attempt }}
          path: verification-context/
          retention-days: 30
  verify:
    needs: prepare
    if: needs.prepare.outputs.verify == 'true'
    runs-on: [self-hosted, Linux, X64, qrh-proof]
    strategy:
      fail-fast: false
      matrix:
        result: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # Leave time for setup, replay, and artifact upload before finalization.
    timeout-minutes: 870
    permissions:
      contents: read
    env:
      QRH_REPLAY_BUDGET_SECONDS: "43200"
      QRH_WORKER_THREADS: "6"
      QRH_KERNEL_JOBS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verification-context-${{ github.run_attempt }}
          path: verification-context/
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select the affected result
        run: node verifier/actions/select.mjs
        env:
          QRH_RESULT_ID: ${{ matrix.result }}
      - name: Read the exact submitted Lean source
        id: source
        continue-on-error: true
        run: node verifier/actions/prepare.mjs
      - name: Validate a protected independently verified receipt
        id: receipt
        if: steps.source.outcome == 'success'
        run: node verifier/actions/reuse-receipt.mjs
      - name: Restore the shared checking environment
        if: steps.source.outcome == 'success' && steps.receipt.outcome == 'success' && steps.receipt.outputs.reused != 'true'
        uses: ./.github/actions/verifier-cache
      - name: Install worker prerequisites
        id: prerequisites
        if: steps.source.outcome == 'success' && steps.receipt.outcome == 'success' && steps.receipt.outputs.reused != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config zstd libgmp-dev python3-yaml
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Build the pinned checking environment
        id: setup
        if: steps.prerequisites.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 120
        run: python3 verifier/actions/setup.py
      - name: Restore authenticated server compilation
        if: steps.setup.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        run: python3 verifier/actions/restore-build.py
      - name: Publish cache diagnostics
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-cache-${{ github.run_attempt }}-${{ matrix.result }}
          path: |
            verification/build-cache-status.json
            verification/build-cache-inputs.json
          retention-days: 7
      - name: Check the canonical theorem with Comparator and all three kernels
        id: check
        if: steps.setup.outcome == 'success'
        # Replay enforces its own deadline, leaving time to upload diagnostics.
        run: python3 verifier/actions/run.py
      - name: Record worker completion
        if: always()
        run: |
          mkdir -p verification
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("verification/worker-status.json", JSON.stringify({result:process.env.QRH_CHECK_RESULT}));'
        env:
          QRH_CHECK_RESULT: ${{ steps.receipt.outcome == 'success' && steps.receipt.outputs.reused == 'true' && 'success' || steps.check.outcome }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proof-verification-${{ github.run_attempt }}-${{ matrix.result }}
          path: |
            verification/worker-status.json
            verification/build-cache-status.json
            verification/attempt.json
            verification/run/logs/
            verification/run/result.json
            verification/run/controls.json
            verification/run/contract.json
            verification/run/phases.json
            verification/run/exports/
            verification/run/judge/logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Require successful worker verification
        if: always() && steps.check.outcome != 'success' && !(steps.receipt.outcome == 'success' && steps.receipt.outputs.reused == 'true')
        run: |
          echo "Proof verification failed; see the worker diagnostics above."
          exit 1
  admission:
    needs: [prepare, verify]
    if: always() && needs.prepare.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only this trusted publisher can archive small verification records.
      # Candidate proof workers retain read-only repository access.
      contents: write
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verification-context-${{ github.run_attempt }}
          path: verification-context/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: proof-verification-${{ github.run_attempt }}-*
          path: verification-results/
      - name: Publish verification for the current PR head
        # Decimal comparisons use generated metadata, never a maintained catalogue.
        # The publisher also archives new admissions before marking them accepted.
        run: node verifier/actions/finalize.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: verification-record-${{ github.run_attempt }}
          path: verification/certificates/
          if-no-files-found: error
