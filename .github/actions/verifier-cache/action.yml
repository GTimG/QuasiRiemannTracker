name: Restore the shared checking environment
description: Restore dependencies built by the default-branch cache publisher
outputs:
  key:
    description: Environment key shared by all proof workers
    value: ${{ steps.plan.outputs.key }}
  path:
    description: Directory containing the reusable dependencies
    value: ${{ steps.plan.outputs.path }}
  cache-hit:
    description: Whether the exact environment was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      run: node verifier/actions/cache.mjs
    - id: restore
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.plan.outputs.path }}
        key: ${{ steps.plan.outputs.key }}
    - name: Start fresh when cache download fails
      if: steps.restore.outcome == 'failure'
      shell: bash
      run: rm -rf -- verification/environment
