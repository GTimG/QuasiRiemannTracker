name = "axiommath_general_number_fields"
defaultTargets = ["Candidate", "DedekindZetaChallenge", "DedekindZetaSolution"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0493595ecd5da8ef14742febab99728f98e948e8"

[[lean_lib]]
name = "Submissions"
srcDir = "../../submissions/2026-10-12-axiommath-general-number-fields/src"
globs = ["Submissions.axiommath_general_number_fields.+"]

[[lean_lib]]
name = "Candidate"
srcDir = "../../submissions/2026-10-12-axiommath-general-number-fields/src"
globs = ["Candidate.+"]

[[lean_lib]]
name = "DedekindZetaChallenge"
srcDir = "Challenge"

[[lean_lib]]
name = "DedekindZetaSolution"
srcDir = "Solution"
